# Generated by ChatGPT using model Astra Light 6
---
- name: Get firewalld version
  ansible.builtin.command: firewall-offline-cmd --version
  register: __firewall_version
  changed_when: false
  check_mode: false

- name: Assert firewall policy name length
  ansible.builtin.assert:
    that:
      - item.policy | length <= __firewall_policy_name_max_length | int
    fail_msg: >-
      firewall[{{ idx }}] has invalid policy name length:
      {{ item.policy | length }} characters; firewalld
      {{ __firewall_version.stdout | trim }} allows at most
      {{ __firewall_policy_name_max_length }} characters.
  vars:
    __firewall_policy_name_max_length: >-
      {{ 128 if (__firewall_version.stdout | trim is version('2.4.0', '>=')) else 18 }}
  loop: "{{ [firewall] if firewall is mapping else (firewall | default([], true)) }}"
  loop_control:
    index_var: idx
    label: "{{ idx }}"
  when: item.policy is defined
