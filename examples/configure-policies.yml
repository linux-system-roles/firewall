---
# Run with: ansible-playbook examples/configure-policies.yml -i inventory -e targets=myhost
# Requires firewalld 0.9.0 or later. Setting policies_disabled to true also
# requires a firewalld version supporting the policy disable flag.
- name: Configure host and inter-zone firewall policies
  hosts: "{{ targets }}"
  become: true
  vars:
    # Replace these documentation networks with your actual source networks.
    # Interface bindings (interface: enp1s0, for example) can be used instead.
    # Routing and IP forwarding must already be configured for inter-zone traffic.
    policy_client_network: 192.0.2.0/24
    policy_server_network: 198.51.100.0/24
    policy_web_server: 198.51.100.10
    # False permits activation; true prevents it without removing policy rules.
    policies_disabled: false
    firewall:
      # Create dedicated zones before referencing them in a policy.
      - zone: policy-clients
        state: present
      - zone: policy-servers
        state: present

      # Regular zones need source or interface bindings to become active.
      - zone: policy-clients
        source: "{{ policy_client_network }}"
        state: enabled
      - zone: policy-servers
        source: "{{ policy_server_network }}"
        state: enabled

      # This policy applies from clients to servers, not in the reverse direction.
      # CONTINUE leaves unmatched traffic to subsequent firewall rules.
      # All these settings are applied to both permanent and runtime configuration.
      - policy: clients-to-servers
        ingress_zone: policy-clients
        egress_zone: policy-servers
        service: [http, https]
        port: [8443/tcp]
        protocol: [icmp]
        icmp_block: [echo-request]
        forward_port: ["8080/tcp;80;{{ policy_web_server }}"]
        rich_rule:
          - 'rule family="ipv4" source address="192.0.2.10/32" service name="ssh" accept'
        target: CONTINUE
        is_disabled: "{{ policies_disabled }}"
        permanent: true
        runtime: true
        state: present

      # HOST means traffic originating on this machine. ANY covers regular zones
      # and excludes HOST. Each symbolic zone must be alone in its zone set.
      # Symbolic zones need no source or interface bindings.
      - policy: host-outbound
        ingress_zone: HOST
        egress_zone: ANY
        service: [dns, http, https]
        target: CONTINUE
        is_disabled: "{{ policies_disabled }}"
        state: present

  roles:
    - linux-system-roles.firewall

# Gather firewall facts with firewall: {detailed: true}, then inspect
# firewall_config.active_policies for active runtime policy names.
# Both zone sets must be populated and active, and the disable flag must be clear.
# Omitting is_disabled leaves the flag unchanged.
# Set is_disabled: false to clear it. is_disabled: true with state: absent
# sets the flag and keeps the policy.
# To remove a primitive, specify it with state: disabled on an existing policy.
# To delete a policy, use only its policy name and state: absent.
# Creation/deletion and target changes reload firewalld when runtime is requested.
# Put any runtime-only entries after those operations, because reload discards them.
