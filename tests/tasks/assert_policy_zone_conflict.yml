---
- name: Reset symbolic zone rejection result
  set_fact:
    __policy_zone_rejected: false

- name: Reject mixed symbolic and regular zones
  block:
    - name: Attempt conflicting policy update
      include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        firewall:
          - policy: "{{ __policy_name }}"
            service: [domain]
            state: enabled
          - "{{ __policy_zone_case.options | combine({'policy': __policy_name, 'state': 'enabled'}) }}"
        __firewall_test_check_mode: "{{ __policy_zone_case.check_mode }}"
  rescue:
    - name: Check symbolic zone validation error
      assert:
        that:
          - "'cannot mix HOST or ANY' in ansible_failed_result.msg"

    - name: Record symbolic zone rejection
      set_fact:
        __policy_zone_rejected: true

- name: Require conflicting policy update to fail
  assert:
    that: __policy_zone_rejected
