---
- name: Test activation with isolated zones and source bindings
  block:
    - name: Remove leftover activation objects
      include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        firewall:
          - {policy: lsr-activation, state: absent}
          - {zone: lsr-act-in, state: absent}
          - {zone: lsr-act-out, state: absent}

    - name: Exercise activation transitions
      include_tasks: check_policy_activation_step.yml
      loop:
        - name: Empty zone sets
          config:
            - {zone: lsr-act-in, state: present}
            - {zone: lsr-act-out, state: present}
            - {policy: lsr-activation, state: present}
          active: false
        - name: Empty egress set
          config: [{policy: lsr-activation, ingress_zone: lsr-act-in, state: enabled}]
          active: false
        - name: Both sets populated but neither zone active
          config: [{policy: lsr-activation, egress_zone: lsr-act-out, state: enabled}]
          active: false
        - name: Only ingress zone active
          config: [{zone: lsr-act-in, source: 192.0.2.1/32, state: enabled}]
          active: false
        - name: Both zones active
          config: [{zone: lsr-act-out, source: 198.51.100.1/32, state: enabled}]
          active: true
        - name: Ingress zone loses its last binding
          config: [{zone: lsr-act-in, source: 192.0.2.1/32, state: disabled}]
          active: false
        - name: Ingress zone regains its binding
          config: [{zone: lsr-act-in, source: 192.0.2.1/32, state: enabled}]
          active: true
        - name: Empty ingress set despite active zones
          config: [{policy: lsr-activation, ingress_zone: lsr-act-in, state: disabled}]
          active: false
      loop_control:
        loop_var: __activation_case
        label: "{{ __activation_case.name }}"

  always:
    - name: Remove activation policy and zones
      include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        firewall:
          - {policy: lsr-activation, state: absent}
          - {zone: lsr-act-in, state: absent}
          - {zone: lsr-act-out, state: absent}
