---
- name: Reset policy validation result
  set_fact:
    __policy_input_rejected: false

- name: Validate invalid policy input
  block:
    - name: Run policy argument validation
      include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        __sr_tasks_from: "{{ __policy_validation_tasks | default('assert_role_vars') }}"
        firewall: "{{ __invalid_policy }}"
  rescue:
    - name: Check that policy validation rejected the input
      assert:
        that:
          - >-
            (__policy_validation_error | default('has invalid policy values'))
            in (((ansible_failed_result.results | default([])
                  | map(attribute='msg') | list)
                 + [ansible_failed_result.msg | default('')]) | join(' '))

    - name: Record policy validation failure
      set_fact:
        __policy_input_rejected: true

- name: Require policy validation to fail
  assert:
    that: __policy_input_rejected
