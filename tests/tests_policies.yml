---
- name: Test firewall policies
  hosts: all
  become: true
  vars:
    __policy_name: lsr-test-policy
    __policy_rule: 'rule family="ipv4" destination address="192.0.2.0/24" accept'
    __policy_config:
      - policy: "{{ __policy_name }}"
        ingress_zone: HOST
        egress_zone: ANY
        target: CONTINUE
        rich_rule: ["{{ __policy_rule }}"]
        service: [http, https]
        port: [8443/tcp]
        source_port: [1024-2048/udp]
        protocol: [icmp]
        icmp_block: [echo-request]
        state: present
      - policy: lsr-test-forward
        ingress_zone: internal
        egress_zone: ANY
        forward_port: ['8080/tcp;80;192.0.2.1']
        state: present
      - policy: lsr-test-masq
        ingress_zone: internal
        egress_zone: external
        masquerade: true
        state: present
  tasks:
    - name: Check invalid policy input
      include_tasks: tasks/assert_invalid_policy.yml
      loop:
        - {policy: 42, state: present}
        - {policy: '', state: present}
        - {policy: 'bad.name', state: present}
        - {policy: test, ingress_zone: [HOST], state: present}
        - {policy: test, egress_zone: 42, state: present}
        - {policy: test, target: default, state: present}
        - {policy: test, state: invalid}
        - {policy: test, rich_rule: [42], state: present}
        - {policy: test, permanent: false, state: present}
        - {policy: test, runtime: invalid, state: enabled}
        - {policy: test, zone: public, state: present}
        - {policy: test, service: [42], state: enabled}
        - {policy: test, port: 42, state: enabled}
        - {policy: test, protocol: [false], state: enabled}
        - {policy: test, masquerade: invalid, state: enabled}
        - {policy: test, is_disabled: 'yes', state: enabled}
        - {policy: test, is_disabled: 1, state: enabled}
        - {policy: test, is_disabled: null, state: enabled}
        - {is_disabled: false, state: enabled}
        - {ingress_zone: HOST, state: enabled}
      loop_control:
        loop_var: __invalid_policy

    - name: Initialize firewall and reset
      include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        firewall:
          - previous: replaced

    - name: Get installed firewalld version for policy name tests
      command: firewall-offline-cmd --version
      register: __policy_test_version
      changed_when: false
      check_mode: false

    - name: Check invalid policy input with version-dependent name length
      include_tasks: tasks/assert_invalid_policy.yml
      vars:
        __policy_validation_tasks: assert_role_vars_version
        __policy_validation_error: has invalid policy name length
        __invalid_policy:
          policy: "{{ 'p' * (__policy_name_limit | int + 1) }}"
          state: present
        __policy_name_limit: >-
          {{ 128 if (__policy_test_version.stdout | trim is version('2.4.0', '>=')) else 18 }}
      loop: [false, true]
      loop_control:
        loop_var: __policy_validation_check_mode
      args:
        apply:
          check_mode: "{{ __policy_validation_check_mode }}"

    - name: Check valid policy name at the version-dependent length limit
      include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        __sr_tasks_from: assert_role_vars_version
        firewall:
          - policy: "{{ 'p' * (__policy_name_limit | int) }}"
            state: present
        __policy_name_limit: >-
          {{ 128 if (__policy_test_version.stdout | trim is version('2.4.0', '>=')) else 18 }}

    - name: Check for policy support
      command: firewall-offline-cmd --get-policies
      register: __policy_support
      changed_when: false
      failed_when: false

    - name: Exercise policy lifecycle
      when: __policy_support.rc == 0
      block:
        - name: Check creation in normal and check mode with diffs
          include_tasks: tasks/check_policy_operation.yml
          vars:
            __policy_operation: create
            __policy_operation_config: "{{ __policy_config }}"
            __policy_expected_added:
              policies:
                lsr-test-policy:
                  ingress_zones: [HOST]
                  egress_zones: [ANY]
                  target: CONTINUE
                  services: [http, https]
                  ports: [['8443', tcp]]
                  source_ports: [['1024-2048', udp]]
                  protocols: [icmp]
                  icmp_blocks: [echo-request]
                  rich_rule: ["{{ __policy_rule }}"]
                lsr-test-forward:
                  ingress_zones: [internal]
                  egress_zones: [ANY]
                  target: CONTINUE
                  forward_ports: [['8080', tcp, '80', '192.0.2.1']]
                lsr-test-masq:
                  ingress_zones: [internal]
                  egress_zones: [external]
                  masquerade: true
            __policy_expected_removed: {}

        - name: Seed configuration to be removed by replacement
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            firewall:
              - policy: lsr-obsolete-test1
                ingress_zone: HOST
                egress_zone: ANY
                service: smtp
                state: present
              - policy: "{{ __policy_name }}"
                service: dns
                state: enabled
              - zone: public
                port: 65000/tcp
                state: enabled

        - name: Check policy replacement in normal and check mode with diffs
          include_tasks: tasks/check_policy_operation.yml
          vars:
            __policy_operation: replace
            __policy_operation_config: "{{ [{'previous': 'replaced'}] + __policy_config }}"
            __policy_expected_added: {}
            __policy_expected_removed:
              policies:
                lsr-obsolete-test1:
                  ingress_zones: [HOST]
                  egress_zones: [ANY]
                  services: [smtp]
                  target: CONTINUE
                lsr-test-policy:
                  services: [dns]
              zones:
                public:
                  ports: [['65000', tcp]]

        - name: Gather facts after policy replacement
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            firewall: {detailed: true}

        - name: Check replacement removed stale settings and retained desired policies
          assert:
            that:
              - "'lsr-obsolete-test1' not in __replacement_config.policies"
              - __replacement_config.policies[__policy_name].services | sort == ['http', 'https']
              - __replacement_config.policies[__policy_name].ports == [['8443', 'tcp']]
              - __replacement_config.policies['lsr-test-forward'].forward_ports == [['8080', 'tcp', '80', '192.0.2.1']]
              - __replacement_config.policies['lsr-test-masq'].masquerade
              - "['65000', 'tcp'] not in (__replacement_config.zones.public.ports | default([]))"
          vars:
            __replacement_config: "{{ firewall_config[item] }}"
          loop: >-
            {{ ['custom_permanent_with_defaults', 'custom_runtime_with_defaults']
               if __firewall_is_booted else ['custom_permanent_with_defaults'] }}

        - name: Check symbolic zones remain exclusive
          include_tasks: tasks/assert_policy_zone_conflict.yml
          loop:
            - {options: {ingress_zone: public}, check_mode: true}
            - {options: {ingress_zone: public}, check_mode: false}
            - {options: {ingress_zone: ANY}, check_mode: true}
            - {options: {ingress_zone: ANY}, check_mode: false}
            - {options: {egress_zone: public}, check_mode: true}
            - {options: {egress_zone: public}, check_mode: false}
            - {options: {egress_zone: HOST}, check_mode: true}
            - {options: {egress_zone: HOST}, check_mode: false}
          loop_control:
            loop_var: __policy_zone_case

        - name: Gather policy facts
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            firewall:
              detailed: true

        - name: Check permanent policy facts
          assert:
            that:
              - __policy.ingress_zones == ['HOST']
              - __policy.egress_zones == ['ANY']
              - __policy.target == 'CONTINUE'
              - __policy.rich_rule == [__policy_rule]
              - __policy.services | sort == ['http', 'https']
              - __policy.ports == [['8443', 'tcp']]
              - __policy.source_ports == [['1024-2048', 'udp']]
              - __policy.protocols == ['icmp']
              - __policy.icmp_blocks == ['echo-request']
          vars:
            __policy: >-
              {{ firewall_config.custom_permanent_with_defaults.policies[__policy_name] }}

        - name: Check runtime policy facts
          assert:
            that:
              - __policy.ingress_zones == ['HOST']
              - __policy.egress_zones == ['ANY']
              - __policy.rich_rule == [__policy_rule]
              - __policy.services | sort == ['http', 'https']
              - __policy.ports == [['8443', 'tcp']]
              - __policy.source_ports == [['1024-2048', 'udp']]
              - __policy.protocols == ['icmp']
              - __policy.icmp_blocks == ['echo-request']
          vars:
            __policy: >-
              {{ firewall_config.custom_runtime_with_defaults.policies[__policy_name] }}
          when: __firewall_is_booted

        - name: Check policy forward-port facts in each scope
          assert:
            that:
              - __policy.ingress_zones == ['internal']
              - __policy.egress_zones == ['ANY']
              - __policy.forward_ports == [['8080', 'tcp', '80', '192.0.2.1']]
          vars:
            __policy: "{{ firewall_config[item].policies['lsr-test-forward'] }}"
          loop: >-
            {{ ['custom_permanent_with_defaults', 'custom_runtime_with_defaults']
               if __firewall_is_booted else ['custom_permanent_with_defaults'] }}

        - name: Check policy masquerade facts
          assert:
            that:
              - firewall_config.custom_permanent_with_defaults.policies['lsr-test-masq'].masquerade

        - name: Check for policy disable flag support
          command: firewall-cmd --policy={{ __policy_name }} --query-disable
          changed_when: false
          failed_when: false
          register: __disable_support
          when: __firewall_is_booted

        - name: Exercise policy disable flag
          include_tasks: tasks/check_policy_disabled.yml
          loop: [true, false]
          loop_control:
            loop_var: __policy_disabled
          when:
            - __firewall_is_booted
            - __disable_support.rc in [0, 1]

        - name: Exercise regular zone activation
          include_tasks: tasks/check_policy_activation.yml
          when: __firewall_is_booted

        - name: Check primitive removal in normal and check mode with diffs
          include_tasks: tasks/check_policy_operation.yml
          vars:
            __policy_operation: remove
            __policy_operation_config:
              - policy: "{{ __policy_name }}"
                rich_rule: ["{{ __policy_rule }}"]
                service: [http, https]
                port: [8443/tcp]
                source_port: [1024-2048/udp]
                protocol: [icmp]
                icmp_block: [echo-request]
                state: disabled
              - policy: lsr-test-forward
                forward_port: ['8080/tcp;80;192.0.2.1']
                state: disabled
              - policy: lsr-test-masq
                masquerade: false
                state: disabled

            __policy_expected_added:
              policies:
                lsr-test-masq:
                  masquerade: false
            __policy_expected_removed:
              policies:
                lsr-test-policy:
                  services: [http, https]
                  ports: [['8443', tcp]]
                  source_ports: [['1024-2048', udp]]
                  protocols: [icmp]
                  icmp_blocks: [echo-request]
                  rich_rule: ["{{ __policy_rule }}"]
                lsr-test-forward:
                  forward_ports: [['8080', tcp, '80', '192.0.2.1']]
                lsr-test-masq:
                  masquerade: true

        - name: Check deletion in normal and check mode with diffs
          include_tasks: tasks/check_policy_operation.yml
          vars:
            __policy_operation: delete
            __policy_operation_config:
              - {policy: "{{ __policy_name }}", state: absent}
              - {policy: lsr-test-forward, state: absent}
              - {policy: lsr-test-masq, state: absent}
            __policy_expected_added: {}
            __policy_expected_removed:
              policies:
                lsr-test-policy:
                  ingress_zones: [HOST]
                  egress_zones: [ANY]
                  target: CONTINUE
                lsr-test-forward:
                  ingress_zones: [internal]
                  egress_zones: [ANY]
                  target: CONTINUE
                lsr-test-masq:
                  ingress_zones: [internal]
                  egress_zones: [external]
                  masquerade: false

        - name: Delete test policy
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            firewall:
              - policy: "{{ __policy_name }}"
                state: absent
              - policy: lsr-test-forward
                state: absent
              - policy: lsr-test-masq
                state: absent

        - name: Repeat policy deletion
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            firewall:
              - policy: "{{ __policy_name }}"
                state: absent
              - policy: lsr-test-forward
                state: absent
              - policy: lsr-test-masq
                state: absent

        - name: Check deletion idempotence
          assert:
            that: not firewall_lib_result is changed

      always:
        - name: Reset firewall configuration
          tags:
            - tests::cleanup
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            firewall:
              - previous: replaced
