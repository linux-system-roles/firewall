---
- name: Ensure role handles startup issues
  hosts: all
  tasks:
    - name: Run role to just install firewall and start firewalld
      include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        __sr_public: true  # to get ostree flag

    - name: Mask firewalld
      systemd:
        name: firewalld
        masked: true

    - name: Install conflicting service
      package:
        name: nftables
        state: present
        use: "{{ (__firewall_is_ostree | d(false)) |
                ternary('ansible.posix.rhel_rpm_ostree', omit) }}"

    - name: Enable conflicting service
      service:
        name: nftables
        enabled: true

    - name: Attempt to run role, disabling conflicting services and unmask firewalld
      include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        firewall_disable_conflicting_services: true

    - name: Check that conflicting service is disabled
      service:
        name: nftables
        enabled: false
      check_mode: true
      register: result
      failed_when: result.changed

    - name: Check firewalld state
      systemd:
        name: firewalld
        masked: false
      register: __firewalld_mask_state

    - name: Assert firewalld is unmasked
      assert:
        that: __firewalld_mask_state is not changed 
